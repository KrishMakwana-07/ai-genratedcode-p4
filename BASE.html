<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KRISH — Premium Hero Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111111;
  --deep:#0D0D0D;
  --gray:#1A1A1A;
  --paper:#F5F5F0;
  --neutral:#BDBDBD;
  --accent:#C1121F;
  --serif:'Shippori Mincho', serif;
  --sans:'Zen Kaku Gothic New', sans-serif;
  --page-max:1400px;
  --ease:cubic-bezier(.16,.84,.32,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{background:var(--deep);scroll-behavior:auto;}
body{
  font-family:var(--sans);
  background:var(--deep);
  color:var(--paper);
  overflow-x:hidden;
  cursor:default;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent);color:var(--paper);}

/* ---------- texture layers ---------- */
.grain{
  position:fixed;inset:0;pointer-events:none;z-index:9000;
  opacity:.05;mix-blend-mode:overlay;
}
.grain svg{width:100%;height:100%;}
.halftone-bg{
  position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(var(--paper) 1px, transparent 1.4px);
  background-size:14px 14px;
  opacity:.06;
}
.paper-fold{
  position:absolute;top:0;left:50%;width:1px;height:100%;
  background:repeating-linear-gradient(to bottom, rgba(245,245,240,.08) 0 2px, transparent 2px 10px);
  opacity:.4;pointer-events:none;
}
.crop{position:absolute;width:14px;height:14px;opacity:.35;pointer-events:none;z-index:10;}
.crop::before,.crop::after{content:"";position:absolute;background:var(--paper);}
.crop::before{width:14px;height:1px;top:6px;left:0;}
.crop::after{width:1px;height:14px;left:6px;top:0;}
.crop.tl{top:18px;left:18px;}
.crop.tr{top:18px;right:18px;}
.crop.bl{bottom:18px;left:18px;}
.crop.br{bottom:18px;right:18px;}

/* ---------- cursor ---------- */
.cursor-dot{
  position:fixed;width:8px;height:8px;border-radius:50%;background:var(--accent);
  pointer-events:none;z-index:9998;transform:translate(-50%,-50%);
  transition:transform .15s var(--ease), opacity .2s;
}
.cursor-ring{
  position:fixed;width:36px;height:36px;border:1px solid var(--paper);border-radius:50%;
  pointer-events:none;z-index:9997;transform:translate(-50%,-50%);
  transition:transform .3s var(--ease), width .3s var(--ease), height .3s var(--ease), border-color .3s;
}
@media(hover:none){.cursor-dot,.cursor-ring{display:none;}}

/* ---------- wrapper & layout ---------- */
.wrap{max-width:var(--page-max);margin:0 auto;padding:0 40px;position:relative;}

/* ---------- HERO BANNER ---------- */
#hero-banner{
  position:relative;
  min-height:100vh;
  display:flex;
  align-items:center;
  background:var(--deep);
  color:var(--paper);
  overflow:hidden;
}

/* Layer 3: Giant Background Typography */
.bg-giant-typography{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding-left:5vw;
  pointer-events:none;
  user-select:none;
  z-index:1;
}
.bg-row{
  font-family:var(--serif);
  font-weight:900;
  font-size:clamp(100px, 18vw, 260px);
  line-height:.8;
  color:var(--paper);
  opacity:.025;
  white-space:nowrap;
  letter-spacing:-0.03em;
}
.bg-row.accent-row{
  color:var(--accent);
  opacity:.035;
}

/* Layer 5: Slow Floating Japanese Characters */
.floating-jp-container{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:2;
  overflow:hidden;
}
.jp-char{
  position:absolute;
  font-family:var(--serif);
  color:var(--paper);
  opacity:0.03;
  font-size:clamp(24px, 4vw, 64px);
  user-select:none;
  writing-mode:vertical-rl;
}

/* Layer 4: Moving SVG Blueprint Lines */
.blueprint-lines-overlay{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:2;
  opacity:0.15;
}

/* Light Sweep Effect */
.light-sweep{
  position:absolute;
  top:-50%; left:-50%;
  width:200%; height:200%;
  background:linear-gradient(45deg, transparent 45%, rgba(245,245,240,0.03) 50%, transparent 55%);
  pointer-events:none;
  z-index:5;
  opacity:0;
  transform:translate(-100%, -100%);
}

/* Hero Content Grid */
.hero-grid{
  position:relative;
  z-index:4;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  align-items:center;
  gap:60px;
  width:100%;
  padding:100px 0 60px 0;
}

/* Left Side Styles */
.hero-meta{
  font-size:11px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--neutral);
  margin-bottom:26px;
  display:flex;
  align-items:center;
  gap:12px;
}
.hero-meta span{color:var(--accent);}
.hero-meta::before{
  content:"";
  width:24px;
  height:1px;
  background:var(--accent);
}

h1.hero-title{
  font-family:var(--serif);
  font-weight:800;
  font-size:clamp(64px,11vw,150px);
  line-height:.86;
  letter-spacing:-.01em;
  overflow:hidden;
  color:var(--paper);
}

.hero-sub{
  font-family:var(--serif);
  font-size:clamp(18px,2.2vw,26px);
  color:var(--neutral);
  margin-top:22px;
  font-style:italic;
  max-width:420px;
}

.hero-tags{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:34px;
}
.hero-tags span{
  border:1px solid rgba(245,245,240,.2);
  padding:7px 14px;
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--neutral);
  background:rgba(255,255,255,0.01);
}

/* CTA Action Area */
.hero-actions{
  display:flex;
  align-items:center;
  gap:20px;
  margin-top:44px;
}
.cta-button{
  display:inline-flex;
  align-items:center;
  gap:14px;
  background:transparent;
  border:1px solid var(--paper);
  color:var(--paper);
  padding:16px 32px;
  font-family:var(--sans);
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  text-decoration:none;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  transition:border-color .3s, color .3s;
}
.cta-button::before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--accent);
  transform:translateY(100%);
  transition:transform .4s var(--ease);
  z-index:0;
}
.cta-button span{
  position:relative;
  z-index:1;
  transition:color .3s;
}
.cta-button svg{
  position:relative;
  z-index:1;
  width:16px;
  height:16px;
  stroke:currentColor;
  transition:transform .3s var(--ease);
}
.cta-button:hover{
  border-color:var(--accent);
}
.cta-button:hover::before{
  transform:translateY(0);
}
.cta-button:hover svg{
  transform:translateX(4px);
}

/* Right Side: Architectural Blueprint Portrait Frame */
.hero-panel-wrapper{
  position:relative;
  width:100%;
  max-width:500px;
  margin:0 auto;
}
.hero-panel{
  position:relative;
  aspect-ratio:3/4;
  background:rgba(17,17,17,0.6);
  border:1px solid rgba(245,245,240,.2);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  box-shadow: 0 30px 60px rgba(0,0,0,0.5);
}

/* Blueprint Canvas Layer inside Panel */
.blueprint-svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

/* Simulated Portrait Container */
.portrait-container{
  position:absolute;
  inset:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.portrait-silhouette{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0.85;
  transition:transform .6s var(--ease);
}
.hero-panel:hover .portrait-silhouette{
  transform:scale(1.02);
}

/* Blueprint Technical Overlays */
.blueprint-label-tl{
  position:absolute;
  top:10px;
  left:10px;
  font-family:var(--serif);
  font-size:9px;
  letter-spacing:.2em;
  color:var(--accent);
  text-transform:uppercase;
  z-index:3;
}
.blueprint-label-br{
  position:absolute;
  bottom:10px;
  right:10px;
  font-family:var(--serif);
  font-size:9px;
  letter-spacing:.2em;
  color:var(--neutral);
  text-transform:uppercase;
  z-index:3;
}
.crosshair-element{
  position:absolute;
  width:20px;
  height:20px;
  pointer-events:none;
  z-index:3;
  opacity:0.4;
}
.crosshair-element::before, .crosshair-element::after{
  content:"";
  position:absolute;
  background:var(--paper);
}
.crosshair-element::before{top:9px;left:0;width:20px;height:1px;}
.crosshair-element::after{top:0;left:9px;width:1px;height:20px;}
.ch-tr{top:15px;right:15px;}
.ch-bl{bottom:15px;left:15px;}

.frame-cap{
  position:absolute;
  bottom:0; left:0; right:0;
  z-index:4;
  font-family:var(--serif);
  font-size:10px;
  letter-spacing:.3em;
  text-transform:uppercase;
  color:var(--neutral);
  padding:14px 20px;
  background:linear-gradient(to top, rgba(13,13,13,0.9), transparent);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.frame-cap span{color:var(--accent);}

/* Vertical Japanese Tag on right edge */
.vertical-jp{
  writing-mode:vertical-rl;
  font-family:var(--serif);
  font-size:13px;
  letter-spacing:.5em;
  color:var(--neutral);
  position:absolute;
  right:40px;
  top:50%;
  transform:translateY(-50%);
  opacity:.4;
  pointer-events:none;
}

/* Scroll Cue at Bottom */
.scroll-cue{
  position:absolute;
  bottom:36px;
  left:40px;
  display:flex;
  align-items:center;
  gap:12px;
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--neutral);
  z-index:4;
}
.scroll-cue .line{
  width:1px;
  height:34px;
  background:var(--neutral);
  overflow:hidden;
  position:relative;
}
.scroll-cue .line::after{
  content:"";
  position:absolute;
  top:-100%;
  left:0;
  width:100%;
  height:100%;
  background:var(--accent);
  animation:scrolldrip 1.8s infinite var(--ease);
}
@keyframes scrolldrip{to{top:100%;}}

/* Responsive Adjustments */
@media(max-width:960px){
  .hero-grid{
    grid-template-columns:1fr;
    gap:40px;
    padding-top:120px;
  }
  .vertical-jp{display:none;}
  .hero-panel-wrapper{max-width:100%;}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;}
}
@media (max-width: 960px) {
  .hero-grid { grid-template-columns: 1fr; gap: 40px; padding-top: 120px; }
  .vertical-jp { display: none; }
  .hero-panel-wrapper { max-width: 100%; }
}
</style>
</head>
<body>

<div class="grain">
  <svg><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
<div class="paper-fold"></div>

<div class="cursor-dot" id="cdot"></div>
<div class="cursor-ring" id="cring"></div>

<div class="crop tl"></div><div class="crop tr"></div><div class="crop bl"></div><div class="crop br"></div>

<section id="hero-banner">
  
  <div class="halftone-bg"></div>

  <div class="bg-giant-typography" id="bgGiantText">
    <div class="bg-row">01</div>
    <div class="bg-row accent-row">KRISH</div>
    <div class="bg-row">ARCHITECT</div>
  </div>

  <div class="floating-jp-container" id="floatingJpContainer">
    <div class="jp-char" style="top:15%; left:85%;" data-speed="0.5">創造</div>
    <div class="jp-char" style="top:65%; left:5%;" data-speed="0.8">未来</div>
    <div class="jp-char" style="top:25%; left:45%;" data-speed="0.3">開発</div>
    <div class="jp-char" style="top:75%; left:75%;" data-speed="0.6">設計</div>
    <div class="jp-char" style="top:45%; left:25%;" data-speed="0.4">芸術</div>
  </div>

  <svg class="blueprint-lines-overlay" viewBox="0 0 1440 900" preserveAspectRatio="none">
    <line x1="0" y1="200" x2="1440" y2="200" stroke="#F5F5F0" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.3"/>
    <line x1="0" y1="700" x2="1440" y2="700" stroke="#F5F5F0" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.3"/>
    <line x1="360" y1="0" x2="360" y2="900" stroke="#F5F5F0" stroke-width="0.5" opacity="0.2"/>
    <line x1="1080" y1="0" x2="1080" y2="900" stroke="#C1121F" stroke-width="0.5" opacity="0.3"/>
  </svg>

  <div class="light-sweep" id="lightSweep"></div>

  <div class="wrap hero-grid">
    
    <div class="hero-left-content">
      <div class="hero-meta">Volume 01 &nbsp;/&nbsp; Chapter <span>001</span></div>
      
      <h1 class="hero-title" id="heroTitle">KRISH</h1>
      
      <p class="hero-sub" id="heroSub">"The Journey of a Developer"</p>
      
      <div class="hero-tags" id="heroTags">
        <span>Computer Engineering</span>
        <span>OS Developer</span>
        <span>Linux</span>
        <span>Digital Art</span>
      </div>

      <div class="hero-actions" id="heroActions">
        <a href="index.html" class="cta-button magnetic">
          <span>Explore Missions</span>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
      </div>
    </div>

    <div class="hero-panel-wrapper" id="heroPanelWrap">
      <div class="hero-panel">
        
        <div class="blueprint-label-tl">SYS.REF // 001-A</div>
        <div class="blueprint-label-br">COORDS: 35.6762° N, 139.6503° E</div>
        <div class="crosshair-element ch-tr"></div>
        <div class="crosshair-element ch-bl"></div>

        <svg class="blueprint-svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
          <pattern id="blueprintGrid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#F5F5F0" stroke-width="0.5" opacity="0.08"/>
          </pattern>
          <rect width="400" height="500" fill="url(#blueprintGrid)" />

          <circle class="draw-path" cx="200" cy="220" r="140" fill="none" stroke="#C1121F" stroke-width="1" opacity="0.4" stroke-dasharray="879" stroke-dashoffset="879"/>
          <circle class="draw-path" cx="200" cy="220" r="100" fill="none" stroke="#F5F5F0" stroke-width="0.5" opacity="0.25" stroke-dasharray="628" stroke-dashoffset="628"/>
          
          <polygon class="draw-path" points="200,60 340,240 260,420 140,420 60,240" fill="none" stroke="#F5F5F0" stroke-width="1" opacity="0.3" stroke-dasharray="900" stroke-dashoffset="900"/>
          
          <line x1="0" y1="0" x2="400" y2="500" stroke="#F5F5F0" stroke-width="0.5" opacity="0.1"/>
          <line x1="400" y1="0" x2="0" y2="500" stroke="#F5F5F0" stroke-width="0.5" opacity="0.1"/>
          
          <rect x="130" y="140" width="140" height="160" fill="none" stroke="#C1121F" stroke-width="1" opacity="0.6"/>
        </svg>

        <div class="portrait-container">
          <div class="portrait-silhouette">
            <svg viewBox="0 0 300 360" width="80%" height="80%">
              <circle cx="150" cy="120" r="55" fill="none" stroke="#F5F5F0" stroke-width="1.5" opacity="0.8"/>
              <path d="M60 320 Q150 200 240 320" fill="none" stroke="#F5F5F0" stroke-width="1.5" opacity="0.8"/>
              <line x1="150" y1="20" x2="150" y2="340" stroke="#C1121F" stroke-width="0.75" opacity="0.5" stroke-dasharray="4 4"/>
              <line x1="50" y1="180" x2="250" y2="180" stroke="#C1121F" stroke-width="0.75" opacity="0.5" stroke-dasharray="4 4"/>
            </svg>
          </div>
        </div>

        <div class="frame-cap">
          <span>Fig. 001</span>
          <span>Character Sheet // Arch-01</span>
        </div>

      </div>
    </div>

  </div>

  <div class="vertical-jp">開発者の物語 — 意志</div>

  <div class="scroll-cue">
    <div class="line"></div>
    <span>Scroll to read</span>
  </div>

</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
gsap.registerPlugin(ScrollTrigger);

/* ---------- Custom Smooth Cursor Logic ---------- */
if(!reducedMotion && matchMedia('(hover:hover)').matches){
  const dot = document.getElementById('cdot'), ring = document.getElementById('cring');
  let mx = window.innerWidth / 2, my = window.innerHeight / 2;
  let rx = mx, ry = my;

  window.addEventListener('mousemove', e => {
    mx = e.clientX; 
    my = e.clientY; 
    dot.style.left = mx + 'px'; 
    dot.style.top = my + 'px';
  });

  (function renderCursor(){
    rx += (mx - rx) * 0.15;
    ry += (my - ry) * 0.15;
    ring.style.left = rx + 'px';
    ring.style.top = ry + 'px';
    requestAnimationFrame(renderCursor);
  })();

  document.querySelectorAll('a, button, .cta-button').forEach(el => {
    el.addEventListener('mouseenter', () => {
      ring.style.width = '60px';
      ring.style.height = '60px';
      ring.style.borderColor = 'var(--accent)';
    });
    el.addEventListener('mouseleave', () => {
      ring.style.width = '36px';
      ring.style.height = '36px';
      ring.style.borderColor = 'var(--paper)';
    });
  });
}

/* ---------- Magnetic Button Effect ---------- */
document.querySelectorAll('.magnetic').forEach(el => {
  el.addEventListener('mousemove', e => {
    if(reducedMotion) return;
    const rect = el.getBoundingClientRect();
    const x = e.clientX - rect.left - rect.width / 2;
    const y = e.clientY - rect.top - rect.height / 2;
    gsap.to(el, { x: x * 0.3, y: y * 0.3, duration: 0.3, ease: 'power2.out' });
  });
  el.addEventListener('mouseleave', () => {
    gsap.to(el, { x: 0, y: 0, duration: 0.4, ease: 'elastic.out(1, 0.4)' });
  });
});

/* ---------- Hero Banner Entrance Sequence (2.5 - 3s) ---------- */
window.addEventListener('DOMContentLoaded', () => {
  if (reducedMotion) return;

  const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

  // 1. Prepare elements
  gsap.set('#heroPanelWrap', { opacity: 0, scale: 0.95, y: 30 });
  gsap.set('.hero-meta', { opacity: 0, y: -15 });
  gsap.set('#heroSub', { opacity: 0, y: 20 });
  gsap.set('#heroTags span', { opacity: 0, y: 15 });
  gsap.set('#heroActions', { opacity: 0, y: 20 });

  // Split Title Characters for Staggered Animation
  const titleEl = document.getElementById('heroTitle');
  const titleText = titleEl.textContent;
  titleEl.innerHTML = titleText.split('').map(c => `<span style="display:inline-block; opacity:0; transform:translateY(80px);">${c}</span>`).join('');

  // 2. Play Sequence
  tl.to('#heroPanelWrap', { opacity: 1, scale: 1, y: 0, duration: 1.2, delay: 0.2 })
    .to('.hero-meta', { opacity: 1, y: 0, duration: 0.8 }, '-=0.9')
    .to(titleEl.querySelectorAll('span'), { opacity: 1, y: 0, duration: 1, stagger: 0.08, ease: 'power4.out' }, '-=0.7')
    .to('#heroSub', { opacity: 1, y: 0, duration: 0.8 }, '-=0.6')
    .to('#heroTags span', { opacity: 1, y: 0, duration: 0.6, stagger: 0.05 }, '-=0.5')
    .to('#heroActions', { opacity: 1, y: 0, duration: 0.8 }, '-=0.4');

  // SVG Stroke Draw Animation for Blueprint Lines & Circles inside Portrait Frame
  gsap.to('.draw-path', {
    strokeDashoffset: 0,
    duration: 2.2,
    ease: 'power2.inOut',
    delay: 0.5,
    stagger: 0.2
  });
});

/* ---------- Mouse Parallax & Floating Layer Depth ---------- */
if(!reducedMotion){
  const banner = document.getElementById('hero-banner');
  const bgGiantText = document.getElementById('bgGiantText');
  const jpContainer = document.getElementById('floatingJpContainer');
  const heroPanel = document.getElementById('heroPanelWrap');

  banner.addEventListener('mousemove', e => {
    const { clientX, clientY } = e;
    const xPos = (clientX / window.innerWidth - 0.5);
    const yPos = (clientY / window.innerHeight - 0.5);

    gsap.to(bgGiantText, { x: xPos * 30, y: yPos * 30, duration: 1, ease: 'power2.out' });
    gsap.to(jpContainer, { x: xPos * 60, y: yPos * 60, duration: 1, ease: 'power2.out' });
    gsap.to(heroPanel, { x: xPos * -20, y: yPos * -20, duration: 1, ease: 'power2.out' });
  });
}

/* ---------- Periodic Light Sweep Animation (Every 25 seconds) ---------- */
if(!reducedMotion){
  const sweep = document.getElementById('lightSweep');
  function triggerLightSweep(){
    gsap.fromTo(sweep, 
      { x: '-100%', y: '-100%', opacity: 0 },
      { x: '100%', y: '100%', opacity: 0.8, duration: 1.8, ease: 'power2.inOut',
        onComplete: () => { gsap.set(sweep, { opacity: 0 }); }
      }
    );
  }
  setInterval(triggerLightSweep, 25000);
  setTimeout(triggerLightSweep, 4000); // Initial sweep after 4s
}

/* ---------- Scroll Trigger Scaling & Opacity Transition ---------- */
if(!reducedMotion){
  gsap.to('#hero-banner', {
    scrollTrigger: {
      trigger: '#hero-banner',
      start: 'top top',
      end: 'bottom top',
      scrub: true
    },
    scale: 0.96,
    opacity: 0.2,
    transformOrigin: 'center center'
  });
}
</script>
